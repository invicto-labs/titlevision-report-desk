name: Build and publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag and configure dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content app/version.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v' + $config.version)) { throw 'Tag must match app/version.json' }
          if ($config.repository -ne $env:GITHUB_REPOSITORY) { throw 'Update repository must match this repository' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency install failed' }
          npm install --prefix .build --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency install failed' }
          $nodeVersion = node --version
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" -OutFile app/desktop/licenses/Node-LICENSE.txt
          'TITLEVISION_NODE_EXE=' + (Get-Command node).Source >> $env:GITHUB_ENV
          'TITLEVISION_NODE_MODULES=' + (Join-Path $env:GITHUB_WORKSPACE '.build/node_modules') >> $env:GITHUB_ENV
      - name: Test
        run: |
          python app/tests/test_server.py
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed' }
          python app/tests/test_updater.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          python app/tests/test_activation.py
          if ($LASTEXITCODE -ne 0) { throw 'Activation tests failed' }
          python app/tests/test_report.py
          if ($LASTEXITCODE -ne 0) { throw 'Workbook tests failed' }
          python app/tests/test_reconcile.py
          if ($LASTEXITCODE -ne 0) { throw 'Export reconciliation tests failed' }
          python app/tests/test_status_history.py
          if ($LASTEXITCODE -ne 0) { throw 'Status history mapping tests failed' }
          python app/tests/test_main_workbook.py
          if ($LASTEXITCODE -ne 0) { throw 'Main workbook continuity tests failed' }
          python app/tests/test_monthly_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'Monthly status refresh tests failed' }
          node --test --test-isolation=none app/tests/rules.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Rule tests failed' }
          node --test --test-isolation=none app/tests/status_history.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Status popup reader tests failed' }
      - name: Validate Excel file format with Microsoft Open XML SDK
        run: |
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/documentformat.openxml/2.20.0/documentformat.openxml.2.20.0.nupkg' -OutFile .build/openxml.zip
          Expand-Archive .build/openxml.zip .build/openxml
          $sdk = Join-Path $env:GITHUB_WORKSPACE '.build/openxml/lib/net46/DocumentFormat.OpenXml.dll'
          foreach ($folder in Get-ChildItem app/tests/results -Directory -Filter 'report-*') {
            powershell.exe -NoProfile -File app/tests/validate_openxml.ps1 -File (Join-Path $folder.FullName 'report.xlsx') -SdkPath $sdk
            if ($LASTEXITCODE -ne 0) { throw 'Excel format validation failed' }
          }
      - name: Build installer
        run: |
          python app/desktop/build_full.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'outputs/TitleVision-Full-Windows-App/TitleVision-Report-Desk-Setup.exe' 'outputs/TitleVision-Full-Windows-App/TitleVision Report Desk Portable.zip' --verify-tag --title "TitleVision Report Desk $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
